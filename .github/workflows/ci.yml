name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"

jobs:
  batch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Batch dashboard build
        run: python -m fuel_shock.batch --offline
        env:
          PYTHONPATH: src
      - name: Dashboard JSON matches the batch build
        run: git diff --exit-code -- site/data/dashboard.json
      - name: Benchmark smoke test
        run: python -m fuel_shock.benchmark --quick
        env:
          PYTHONPATH: src
